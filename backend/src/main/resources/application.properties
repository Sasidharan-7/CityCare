# ==========================================================
# CityCare Backend Configuration
# ==========================================================
server.port=8080

# Application Name
spring.application.name=citycare-backend

# ----------------------------------------------------------
# Database Configuration
# Production: set SPRING_DATASOURCE_URL to a MySQL JDBC URL
#   (e.g. jdbc:mysql://host:3306/citycare_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true)
# Development default: H2 in MySQL compatibility mode (no server needed)
# ----------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:citycare_db;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA & Hibernate Settings
# Dev (H2): create-and-drop re-seeds via DataInitializer each start
# Production (MySQL): set spring.jpa.hibernate.ddl-auto=update via env or override
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# H2 Console (dev convenience)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ----------------------------------------------------------
# Multipart & File Upload Settings
# ----------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ----------------------------------------------------------
# Security & JWT Configuration
# ----------------------------------------------------------
citycare.jwt.secret=${JWT_SECRET:CityCareSuperSecureJwtSecretKeyForSIH25031SmartCityIssueManagementPlatform2025!}
citycare.jwt.expiration-ms=86400000

# ----------------------------------------------------------
# CityCare AI Microservice Connection
# ----------------------------------------------------------
citycare.ai.service-url=${AI_SERVICE_URL:http://localhost:5000}

# ----------------------------------------------------------
# Local File Storage Configuration
# ----------------------------------------------------------
citycare.upload.dir=uploads

# ----------------------------------------------------------
# Duplicate Detection Parameters (Phase 11)
# ----------------------------------------------------------
citycare.duplicate.distance-meters=100.0
citycare.duplicate.window-hours=48
