# ==========================================================
# CityCare Backend Configuration
# ==========================================================
server.port=8080

# Application Name
spring.application.name=citycare-backend

# ----------------------------------------------------------
# Database Configuration (MySQL with env var fallback)
# ----------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/citycare_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ----------------------------------------------------------
# Multipart & File Upload Settings
# ----------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ----------------------------------------------------------
# Security & JWT Configuration
# ----------------------------------------------------------
citycare.jwt.secret=${JWT_SECRET:CityCareSuperSecureJwtSecretKeyForSIH25031SmartCityIssueManagementPlatform2025!}
citycare.jwt.expiration-ms=86400000

# ----------------------------------------------------------
# CityCare AI Microservice Connection
# ----------------------------------------------------------
citycare.ai.service-url=${AI_SERVICE_URL:http://localhost:5000}

# ----------------------------------------------------------
# Local File Storage Configuration
# ----------------------------------------------------------
citycare.upload.dir=uploads

# ----------------------------------------------------------
# Duplicate Detection Parameters (Phase 11)
# ----------------------------------------------------------
citycare.duplicate.distance-meters=100.0
citycare.duplicate.window-hours=48
