<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – CityCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-text">City<span>Care</span></div>
      </div>
      <nav class="sidebar-nav">
        <a href="citizen-dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="report-issue.html"><span class="nav-icon">📝</span> Report Issue</a>
        <a href="complaints.html"><span class="nav-icon">📋</span> My Complaints</a>
        <a href="notifications.html"><span class="nav-icon">🔔</span> Notifications</a>
        <a href="profile.html"><span class="nav-icon">👤</span> Profile</a>
        <a href="#" data-action="logout"><span class="nav-icon">🚪</span> Logout</a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="user-avatar">U</div>
          <div class="user-info">
            <div class="user-name">User</div>
            <div class="user-role">Citizen</div>
          </div>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay"></div>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-header">
        <button class="hamburger-btn" id="hamburger-btn">☰</button>
        <h1 class="page-title">Dashboard</h1>
        <div class="top-header-actions">
          <a href="report-issue.html" class="btn btn-primary btn-sm">+ Report Issue</a>
        </div>
      </header>

      <div class="page-content">
        <!-- Stats -->
        <div class="stats-grid" id="citizen-stats">
          <!-- Loaded dynamically -->
          <div class="loading-state" style="grid-column: 1/-1;">
            <div class="spinner lg"></div>
            <p>Loading dashboard...</p>
          </div>
        </div>

        <!-- Recent Complaints -->
        <div class="card">
          <div class="card-header">
            <h3>Recent Complaints</h3>
            <a href="complaints.html" class="btn btn-outline btn-sm">View All</a>
          </div>
          <div id="recent-complaints">
            <div class="loading-state">
              <div class="spinner"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/app.js"></script>
  <script src="js/complaints.js"></script>
  <script src="js/dashboard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!App.requireAuth(['CITIZEN'])) return;
      Dashboard.loadCitizenDashboard();
    });
  </script>
</body>
</html>
