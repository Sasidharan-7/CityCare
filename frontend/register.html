<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your CityCare account to report civic issues">
  <title>Create Account – CityCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-logo">
        <div class="logo-text">City<span>Care</span></div>
        <div class="tagline">Report. Track. Resolve.</div>
      </div>

      <div class="auth-card">
        <h2>Create Account</h2>

        <form id="register-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <input type="text" id="name" class="form-control" placeholder="John Doe" autocomplete="name" required>
            <div class="form-error" id="name-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" autocomplete="email" required>
            <div class="form-error" id="email-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="phone">Phone Number</label>
            <input type="tel" id="phone" class="form-control" placeholder="9876543210" autocomplete="tel" required>
            <div class="form-error" id="phone-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="At least 6 characters" autocomplete="new-password" required>
            <div class="form-error" id="password-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" class="form-control" placeholder="Re-enter your password" autocomplete="new-password" required>
            <div class="form-error" id="confirm-password-error"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="login.html">Sign in</a>
        </div>
      </div>

      <div class="auth-footer" style="margin-top: var(--space-4);">
        <a href="index.html">← Back to Home</a>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
