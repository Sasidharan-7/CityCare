<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaint Details – CityCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-text">City<span>Care</span></div>
      </div>
      <nav class="sidebar-nav">
        <a href="citizen-dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="report-issue.html"><span class="nav-icon">📝</span> Report Issue</a>
        <a href="complaints.html" class="active"><span class="nav-icon">📋</span> My Complaints</a>
        <a href="notifications.html"><span class="nav-icon">🔔</span> Notifications</a>
        <a href="profile.html"><span class="nav-icon">👤</span> Profile</a>
        <a href="#" data-action="logout"><span class="nav-icon">🚪</span> Logout</a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="user-avatar">U</div>
          <div class="user-info">
            <div class="user-name">User</div>
            <div class="user-role">Citizen</div>
          </div>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay"></div>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-header">
        <button class="hamburger-btn" id="hamburger-btn">☰</button>
        <h1 class="page-title" id="page-title">Complaint Details</h1>
        <div class="top-header-actions">
          <a href="complaints.html" class="btn btn-outline btn-sm">← Back to Complaints</a>
        </div>
      </header>

      <div class="page-content" id="detail-container">
        <div class="loading-state">
          <div class="spinner lg"></div>
          <p>Loading complaint details...</p>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
  <script src="js/map.js"></script>
  <script src="js/complaints.js"></script>
  <script src="js/dashboard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!App.requireAuth(['CITIZEN'])) return;

      const urlParams = new URLSearchParams(window.location.search);
      const complaintId = urlParams.get('id');

      if (!complaintId) {
        document.getElementById('detail-container').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">⚠️</div>
            <h3>Complaint Not Found</h3>
            <p>No complaint ID was provided in the URL.</p>
            <a href="complaints.html" class="btn btn-primary mt-4">Back to Complaints</a>
          </div>
        `;
        return;
      }

      const complaint = await Dashboard.loadComplaintDetail(complaintId);
      if (!complaint) {
        document.getElementById('detail-container').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">⚠️</div>
            <h3>Unable to Load Complaint</h3>
            <p>Could not fetch details for complaint #${App.escapeHtml(complaintId)}.</p>
            <a href="complaints.html" class="btn btn-primary mt-4">Back to Complaints</a>
          </div>
        `;
        return;
      }

      document.getElementById('page-title').textContent = `Complaint #${complaint.complaintId || complaint.id}`;

      const timelineHtml = Complaints.renderTimeline(complaint.status, complaint.updates || []);
      const deptName = complaint.department ? complaint.department.name : (complaint.departmentName || 'Pending Assignment');
      const officerName = complaint.officer ? complaint.officer.name : (complaint.officerName || 'Not Assigned Yet');

      // Duplicate warning badge if duplicate
      const duplicateNotice = complaint.possibleDuplicate ? `
        <div style="padding: var(--space-4); background: var(--warning-light); border-radius: var(--radius-md); border-left: 4px solid var(--warning); margin-bottom: var(--space-5);">
          <strong style="color: var(--warning);">⚠️ Possible Duplicate Issue Detected</strong>
          <p class="text-small text-muted" style="margin-top: var(--space-1);">
            Another issue of similar category was recently reported nearby. This complaint has been linked to the primary incident.
          </p>
        </div>
      ` : '';

      // Resolution proof section
      let proofHtml = '';
      if (complaint.resolutionProofUrl || complaint.status === 'RESOLVED' || complaint.status === 'CLOSED') {
        proofHtml = `
          <div class="card mt-6">
            <div class="card-header">
              <h3>Resolution Verification</h3>
              <span class="badge ${App.statusBadge(complaint.status)}">${App.statusLabel(complaint.status)}</span>
            </div>
            <div class="card-body">
              <div class="before-after">
                <div class="ba-item">
                  <div class="ba-label">Original Issue Photo</div>
                  <img src="${complaint.imageUrl || 'img/placeholder.svg'}" alt="Original Problem" onerror="this.src='data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'150\' fill=\'%23e5e7eb\'><rect width=\'200\' height=\'150\' fill=\'%23f3f4f6\'/><text x=\'50%25\' y=\'50%25\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%239ca3af\'>No Image</text></svg>'">
                </div>
                <div class="ba-item">
                  <div class="ba-label">Resolution Proof</div>
                  <img src="${complaint.resolutionProofUrl || 'data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'150\' fill=\'%23e5e7eb\'><rect width=\'200\' height=\'150\' fill=\'%23f3f4f6\'/><text x=\'50%25\' y=\'50%25\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%239ca3af\'>Proof Pending</text></svg>'}" alt="Resolution Proof">
                </div>
              </div>
              ${complaint.resolutionRemarks ? `
                <div style="margin-top: var(--space-4); padding: var(--space-3); background: var(--gray-50); border-radius: var(--radius-md);">
                  <div class="text-xs text-muted">Officer Remarks:</div>
                  <div class="text-small" style="margin-top: var(--space-1);">${App.escapeHtml(complaint.resolutionRemarks)}</div>
                </div>
              ` : ''}

              ${complaint.status === 'RESOLVED' ? `
                <div style="margin-top: var(--space-5); text-align: right;">
                  <button class="btn btn-success" id="btn-close-complaint">✓ Confirm Resolution & Close Complaint</button>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }

      document.getElementById('detail-container').innerHTML = `
        ${duplicateNotice}

        <div class="grid-2">
          <!-- Left Column: Details & Photo -->
          <div>
            <div class="card mb-6">
              <div class="card-header">
                <h3>Issue Information</h3>
                <div class="flex gap-2">
                  <span class="badge ${App.statusBadge(complaint.status)}">${App.statusLabel(complaint.status)}</span>
                  <span class="badge ${App.priorityBadge(complaint.priority)}">${complaint.priority}</span>
                </div>
              </div>
              <div class="card-body">
                ${complaint.imageUrl ? `
                  <div style="margin-bottom: var(--space-5); text-align: center;">
                    <img src="${complaint.imageUrl}" alt="Issue Photo" style="max-height: 280px; width: 100%; object-fit: cover; border-radius: var(--radius-md); border: 1px solid var(--gray-200);">
                  </div>
                ` : ''}

                <div class="detail-section">
                  <h4>Description</h4>
                  <p class="text-small" style="margin-top: var(--space-2); color: var(--gray-700); line-height: 1.6;">
                    ${App.escapeHtml(complaint.description || 'No description provided.')}
                  </p>
                </div>

                <dl class="detail-grid mt-4">
                  <dt>Category</dt>
                  <dd><strong>${App.categoryLabel(complaint.category)}</strong></dd>

                  <dt>Priority</dt>
                  <dd><span class="badge ${App.priorityBadge(complaint.priority)}">${complaint.priority}</span></dd>

                  <dt>Department</dt>
                  <dd>${App.escapeHtml(deptName)}</dd>

                  <dt>Assigned Officer</dt>
                  <dd>${App.escapeHtml(officerName)}</dd>

                  <dt>Reported On</dt>
                  <dd>${App.formatDateTime(complaint.createdAt)}</dd>

                  <dt>Last Update</dt>
                  <dd>${App.formatDateTime(complaint.updatedAt || complaint.createdAt)}</dd>
                </dl>
              </div>
            </div>

            <!-- Resolution proof section if available -->
            ${proofHtml}
          </div>

          <!-- Right Column: Status Timeline & Map -->
          <div>
            <div class="card mb-6">
              <div class="card-header">
                <h3>Progress Timeline</h3>
              </div>
              <div class="card-body">
                <div class="timeline">
                  ${timelineHtml}
                </div>
              </div>
            </div>

            <div class="card">
              <div class="card-header">
                <h3>Location</h3>
                <span class="text-xs text-muted">${complaint.latitude ? `${complaint.latitude.toFixed(4)}, ${complaint.longitude.toFixed(4)}` : 'No GPS'}</span>
              </div>
              <div class="card-body" style="padding: 0;">
                <div class="map-container" id="detail-map" style="border:none; border-radius: 0 0 var(--radius-lg) var(--radius-lg); height: 320px;"></div>
              </div>
            </div>
          </div>
        </div>
      `;

      // Render Map
      if (complaint.latitude && complaint.longitude) {
        setTimeout(() => {
          MapModule.initMap('detail-map', {
            center: [complaint.latitude, complaint.longitude],
            zoom: 16
          });
          MapModule.setMarker(complaint.latitude, complaint.longitude, `
            <strong>#${complaint.complaintId || complaint.id}</strong><br>
            ${App.categoryLabel(complaint.category)}
          `);
        }, 150);
      }

      // Hook close button if present
      const closeBtn = document.getElementById('btn-close-complaint');
      if (closeBtn) {
        closeBtn.addEventListener('click', async () => {
          if (!confirm('Are you sure you want to confirm resolution and close this complaint?')) return;
          try {
            closeBtn.disabled = true;
            await Complaints.updateStatus(complaint.id, 'CLOSED', 'Citizen confirmed resolution.');
            App.Toast.success('Complaint closed successfully.');
            setTimeout(() => window.location.reload(), 1200);
          } catch (err) {
            App.Toast.error(err.message || 'Failed to close complaint.');
            closeBtn.disabled = false;
          }
        });
      }
    });
  </script>
</body>
</html>
